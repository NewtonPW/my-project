<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการร้านดอกไม้ - Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #ffffff; padding: 30px 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .menu-item { display: block; padding: 15px 20px; margin-bottom: 10px; color: #555; text-decoration: none; border-radius: 10px; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background-color: #fce4e4; color: #d9534f; font-weight: bold; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background-color: #ffffff; border-radius: 15px; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 900px; margin: 0 auto; }
        .page-title { text-align: center; color: #d9534f; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 14px; color: #d9534f; margin-bottom: 8px; font-weight: bold; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #d9534f; }
        .btn-submit { grid-column: span 2; background-color: #d9534f; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { background-color: #c9302c; }
        
        /* 🌟 เพิ่ม Style เล็กน้อยสำหรับกล่องอัปโหลดไฟล์ให้สวยงาม */
        .file-upload-box { background-color: #fff; box-sizing: border-box; width: 100%; cursor: pointer;}
        /* 🌟 กล่องแจ้งเตือนสีเขียว */
        .alert-success { 
            background-color: #E8F5E9; 
            color: #2E7D32; 
            padding: 12px 15px; 
            border-radius: 5px; 
            font-size: 14px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            border-left: 5px solid #4CAF50; 
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3 style="color: #d9534f; text-align: center;">🌸 Flora Admin</h3>
        <a href="/admin" class="menu-item active">เพิ่มดอกไม้ใหม่</a>
        <a href="/manage_stock" class="menu-item">จัดการสต็อกดอกไม้</a>
        <a href="/manage_orders" class="menu-item">จัดการคำสั่งซื้อ</a>
        <div style="margin-top: 50px;">
            <a href="/login" class="menu-item" style="color: #f39c12;">🔓 ออกจากระบบ</a>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h2 class="page-title">เพิ่มรายการดอกไม้ใหม่เข้าสต็อก</h2>
            {% if success_msg %}
            <div class="alert-success">
                {{ success_msg }}
            </div>
            {% endif %}
            
            <form action="/add_flower" method="POST" enctype="multipart/form-data">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>ชื่อดอกไม้ *</label>
                        <input type="text" name="name" placeholder="เช่น กุหลาบแดง, ทิวลิป" required>
                    </div>
                    <div class="form-group">
                        <label>วันที่นำเข้าสต็อก</label>
                        <input type="date" name="stock_date">
                    </div>
                    <div class="form-group">
                        <label>สี</label>
                        <input type="text" name="color" placeholder="เช่น แดง, ขาว, เหลือง">
                    </div>
                    <div class="form-group">
                        <label>ราคาต่อหน่วย (บาท) *</label>
                        <input type="number" name="price" placeholder="เช่น 50" required>
                    </div>
                    
                    <div class="form-group" style="grid-column: span 2;">
                        <label>อัปโหลดรูปภาพดอกไม้ (ถ้ามี)</label>
                        <input type="file" name="image" accept="image/*" class="file-upload-box">
                    </div>

                    <button type="submit" class="btn-submit">บันทึกข้อมูลดอกไม้</button>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
